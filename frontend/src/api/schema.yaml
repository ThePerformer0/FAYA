  /api/v1/depots/:
    get:
      operationId: depots_list
      summary: Rechercher les dépôts actifs par proximité et filtres
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          format: uuid
      - in: query
        name: capacity_kg
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      - in: query
        name: lat
        schema:
          type: number
          format: double
          maximum: 90.0
          minimum: -90.0
      - in: query
        name: lng
        schema:
          type: number
          format: double
          maximum: 180.0
          minimum: -180.0
      - in: query
        name: open_now
        schema:
          type: boolean
          default: false
      - in: query
        name: operation
        schema:
          enum:
          - REFILL
          - EXCHANGE
          - FIRST_ACQUISITION
          type: string
          minLength: 1
        description: |-
          * `REFILL` - Recharge
          * `EXCHANGE` - Échange
          * `FIRST_ACQUISITION` - Première bouteille
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: q
        schema:
          type: string
          maxLength: 120
      - in: query
        name: radius_km
        schema:
          type: number
          format: double
          maximum: 200.0
          minimum: 0.1
      tags:
      - Depots
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPublicDepotListList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/depots/{depot_id}/:
    get:
      operationId: depots_retrieve
      summary: Fiche publique détaillée d'un dépôt actif
      parameters:
      - in: path
        name: depot_id
        schema:
          type: string
          format: uuid
        required: true
      tags:
      - Depots
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicDepotDetail'
          description: ''
        '404':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/health/:
    get:
      operationId: health_retrieve
      summary: État de santé de l'API et de la base de données
      tags:
      - System
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
        '503':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthCheck'
          description: ''
  /api/v1/settings/public/:
    get:
      operationId: settings_public_retrieve
      description: Expose les paramètres opérationnels publics et l'heure serveur
