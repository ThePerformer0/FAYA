openapi: 3.0.3
info:
  title: Faya API
  version: 1.0.0
  description: API REST de la plateforme PWA Faya (recherche et réservation de bouteilles
    de gaz).
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Connexion par e-mail et mot de passe
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Déconnexion et révocation du cookie refresh
      tags:
      - Auth
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/me/:
    get:
      operationId: auth_me_retrieve
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Consulter le profil de l'utilisateur connecté
      tags:
      - Auth
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: auth_me_partial_update
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Mettre à jour le profil de l'utilisateur connecté
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedUpdateProfileRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserMe'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/refresh/:
    post:
      operationId: auth_refresh_create
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Renouvellement de l'Access Token via le cookie HttpOnly
      tags:
      - Auth
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenRefreshResponse'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      description: Empêche la mise en cache des réponses contenant des jetons ou données
        personnelles.
      summary: Inscription d'un nouveau client
      tags:
      - Auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '409':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/catalog/brands/:
    get:
      operationId: catalog_brands_list
      summary: Liste des marques actives du catalogue central
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Brand'
          description: ''
  /api/v1/catalog/products/:
    get:
      operationId: catalog_products_list
      summary: Liste paginée des produits publiés du catalogue central
      parameters:
      - in: query
        name: brand
        schema:
          type: string
          format: uuid
      - in: query
        name: capacity_kg
        schema:
          type: string
          format: decimal
          pattern: ^-?\d{0,3}(?:\.\d{0,2})?$
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: product_type
        schema:
          enum:
          - BUTANE
          - PROPANE
          - LPG
          type: string
          minLength: 1
        description: |-
          * `BUTANE` - Butane
          * `PROPANE` - Propane
          * `LPG` - GPL
      tags:
      - Catalog
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedProductList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/depot/:
    get:
      operationId: depot_retrieve
      description: Empêche toute mise en cache HTTP des réponses authentifiées ou
        sensibles.
      summary: Consulter les informations et horaires de son dépôt
      tags:
      - Depot Portal
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDepot'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
    patch:
      operationId: depot_partial_update
      description: Empêche toute mise en cache HTTP des réponses authentifiées ou
        sensibles.
      summary: Mettre à jour les informations et horaires de son dépôt
      tags:
      - Depot Portal
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedManagedDepotUpdateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedManagedDepotUpdateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedManagedDepotUpdateRequest'
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManagedDepot'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '403':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
  /api/v1/depot/offers/:
