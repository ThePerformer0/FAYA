      type: object
      properties:
        operation_type:
          allOf:
          - $ref: '#/components/schemas/OperationTypeEnum'
          readOnly: true
        gas_price:
          type: integer
          readOnly: true
          description: Prix de l'opération ou du gaz (en FCFA).
        bottle_price:
          type: integer
          readOnly: true
          description: Prix de la bouteille (Première bouteille uniquement, en FCFA).
        deposit_amount:
          type: integer
          readOnly: true
          description: Montant de la consigne (Première bouteille uniquement, en FCFA).
        total_unit_price:
          type: integer
          readOnly: true
      required:
      - bottle_price
      - deposit_amount
      - gas_price
      - operation_type
      - total_unit_price
    PublicPlatformSetting:
      type: object
      properties:
        timezone:
          type: string
        order_response_timeout_minutes:
          type: integer
        order_pickup_timeout_minutes:
          type: integer
        order_cutoff_before_close_minutes:
          type: integer
        closing_soon_threshold_minutes:
          type: integer
        max_quantity_per_order:
          type: integer
        max_active_orders_per_customer:
          type: integer
        no_show_threshold:
          type: integer
        no_show_window_days:
          type: integer
        suspension_duration_days:
          type: integer
        server_now:
          type: string
          format: date-time
      required:
      - closing_soon_threshold_minutes
      - max_active_orders_per_customer
      - max_quantity_per_order
      - no_show_threshold
      - no_show_window_days
      - order_cutoff_before_close_minutes
      - order_pickup_timeout_minutes
      - order_response_timeout_minutes
      - server_now
      - suspension_duration_days
      - timezone
    ReasonEnum:
      enum:
      - NO_SHOW_THRESHOLD
      - MANUAL
      type: string
      description: |-
        * `NO_SHOW_THRESHOLD` - Seuil de retraits non effectués dépassé
        * `MANUAL` - Suspension manuelle
    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
        phone:
          type: string
          minLength: 1
          pattern: ^\+[1-9][0-9]{7,14}$
          maxLength: 20
        full_name:
          type: string
          minLength: 2
          maxLength: 150
        password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - email
      - full_name
      - password
      - phone
    RoleEnum:
      enum:
      - CUSTOMER
      - DEPOT_MANAGER
      - ADMIN
      type: string
      description: |-
        * `CUSTOMER` - Client
        * `DEPOT_MANAGER` - Responsable de dépôt
        * `ADMIN` - Administrateur
    StockAdjustRequestMovementTypeEnum:
      enum:
      - INVENTORY_CORRECTION
      - MANUAL_ADJUSTMENT
      type: string
      description: |-
        * `INVENTORY_CORRECTION` - Correction d'inventaire
        * `MANUAL_ADJUSTMENT` - Ajustement manuel
    StockAdjustRequestRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryEnum'
        new_physical_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
        movement_type:
          allOf:
          - $ref: '#/components/schemas/StockAdjustRequestMovementTypeEnum'
          default: INVENTORY_CORRECTION
        reason:
          type: string
          minLength: 1
          maxLength: 500
        expected_physical_quantity:
          type: integer
          maximum: 2147483647
          minimum: 0
      required:
      - category
      - new_physical_quantity
      - product_id
      - reason
    StockMovement:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        product:
          allOf:
          - $ref: '#/components/schemas/Product'
          readOnly: true
        category:
          allOf:
          - $ref: '#/components/schemas/CategoryEnum'
          readOnly: true
        movement_type:
          allOf:
          - $ref: '#/components/schemas/StockMovementMovementTypeEnum'
          readOnly: true
        quantity_before:
          type: integer
          readOnly: true
        quantity_after:
          type: integer
          readOnly: true
        delta:
          type: integer
          readOnly: true
        reason:
          type: string
          readOnly: true
        actor_name:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - actor_name
      - category
      - created_at
      - delta
      - id
      - movement_type
      - product
      - quantity_after
      - quantity_before
      - reason
    StockMovementMovementTypeEnum:
      enum:
      - RESTOCK
      - MANUAL_ADJUSTMENT
      - INVENTORY_CORRECTION
      - SCRAP
      - RESERVATION
      - RELEASE
      - PICKUP_OUT
      - EMPTY_RETURN
      type: string
      description: |-
        * `RESTOCK` - Approvisionnement
        * `MANUAL_ADJUSTMENT` - Ajustement manuel
        * `INVENTORY_CORRECTION` - Correction d'inventaire
        * `SCRAP` - Mise au rebut
        * `RESERVATION` - Réservation
        * `RELEASE` - Libération
        * `PICKUP_OUT` - Remise client
        * `EMPTY_RETURN` - Retour bouteille vide
    StockMutationResponse:
      type: object
      properties:
        stock:
          allOf:
          - $ref: '#/components/schemas/DepotStock'
          readOnly: true
        movement:
          allOf:
          - $ref: '#/components/schemas/StockMovement'
          readOnly: true
      required:
      - movement
      - stock
    StockRestockRequestRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryEnum'
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        reason:
          type: string
          default: ''
          maxLength: 500
      required:
      - category
      - product_id
      - quantity
    StockScrapRequestRequest:
      type: object
      properties:
        product_id:
          type: string
          format: uuid
        category:
          $ref: '#/components/schemas/CategoryEnum'
        quantity:
          type: integer
          maximum: 2147483647
          minimum: 1
        reason:
          type: string
          minLength: 1
          maxLength: 500
      required:
      - category
      - product_id
      - quantity
      - reason
    TokenRefreshResponse:
      type: object
      properties:
        access_token:
          type: string
      required:
      - access_token
    UserMe:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        email:
          type: string
          format: email
          readOnly: true
        phone:
          type: string
          readOnly: true
          description: Numéro au format international E.164 (ex. +2250701020304).
        full_name:
          type: string
          readOnly: true
        role:
          allOf:
          - $ref: '#/components/schemas/RoleEnum'
          readOnly: true
        active_suspension:
          allOf:
          - $ref: '#/components/schemas/ActiveSuspension'
          nullable: true
          readOnly: true
        managed_depot_id:
          type: string
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - active_suspension
      - created_at
      - email
      - full_name
      - id
      - managed_depot_id
      - phone
      - role
  securitySchemes:
    jwtAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
