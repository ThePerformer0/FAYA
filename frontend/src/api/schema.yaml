  /api/v1/depot/stock-movements/:
    get:
      operationId: depot_stock_movements_list
      description: Empêche toute mise en cache HTTP des réponses authentifiées ou
        sensibles.
      summary: Consulter l'historique paginé des mouvements de stock du dépôt
      parameters:
      - in: query
        name: category
        schema:
          enum:
          - FULL
          - EMPTY
          - NEW
          - DEPOSIT
          type: string
          minLength: 1
        description: |-
          * `FULL` - Pleine
          * `EMPTY` - Vide
          * `NEW` - Neuve
          * `DEPOSIT` - Sous consigne
      - in: query
        name: movement_type
        schema:
          enum:
          - RESTOCK
          - MANUAL_ADJUSTMENT
          - INVENTORY_CORRECTION
          - SCRAP
          - RESERVATION
          - RELEASE
          - PICKUP_OUT
          - EMPTY_RETURN
          type: string
          minLength: 1
        description: |-
          * `RESTOCK` - Approvisionnement
          * `MANUAL_ADJUSTMENT` - Ajustement manuel
          * `INVENTORY_CORRECTION` - Correction d'inventaire
          * `SCRAP` - Mise au rebut
          * `RESERVATION` - Réservation
          * `RELEASE` - Libération
          * `PICKUP_OUT` - Remise client
          * `EMPTY_RETURN` - Retour bouteille vide
      - name: page
        required: false
        in: query
        description: Un numéro de page de l'ensemble des résultats.
        schema:
          type: integer
      - name: page_size
        required: false
        in: query
        description: Nombre de résultats à retourner par page.
        schema:
          type: integer
      - in: query
        name: product
        schema:
          type: string
          format: uuid
      tags:
      - Depot Inventory
      security:
      - jwtAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStockMovementList'
          description: ''
        '400':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiError'
          description: ''
        '401':
