name: CI — Faya Backend & Frontend

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (Django + PostGIS + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_DB: faya
          POSTGRES_USER: faya
          POSTGRES_PASSWORD: faya_ci_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U faya -d faya"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DJANGO_SECRET_KEY: ci-ephemeral-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_ALLOWED_HOSTS: "localhost,127.0.0.1,testserver"
      POSTGRES_DB: faya
      POSTGRES_USER: faya
      POSTGRES_PASSWORD: faya_ci_password
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PORT: "5432"
      USE_POSTGIS: "True"
      AUTH_COOKIE_SECURE: "False"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install GeoDjango native libraries (GDAL / GEOS)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libgdal-dev libgeos-dev

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint with Ruff
        working-directory: backend
        run: ruff check apps config

      - name: Django system checks & migration drift check
        working-directory: backend
        run: |
          python manage.py check
          python manage.py makemigrations --check --dry-run

      - name: Validate OpenAPI schema & check drift
        working-directory: backend
        run: |
          python manage.py spectacular --validate --fail-on-warn --file /tmp/schema.yaml
          diff -u --strip-trailing-cr ../frontend/src/api/schema.yaml /tmp/schema.yaml

      - name: Run full pytest suite on PostgreSQL + PostGIS
        working-directory: backend
        run: pytest -q

  frontend:
    name: Frontend (ESLint + TypeScript + Vite)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Lint (ESLint)
        working-directory: frontend
        run: npm run lint

      - name: Typecheck (TypeScript)
        working-directory: frontend
        run: npm run typecheck

      - name: Production build (Vite)
        working-directory: frontend
        run: npm run build
